apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: practica-s12
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              value: "YourStrongPassword2026"
            - name: MSSQL_PID
              value: "Developer"
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: practica-s12
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 1433
      targetPort: 1433
